[package]
name = "wsl-tpm-agent"
description = "ssh-agent that signs with an ECDSA P-256 key in the Windows TPM, served over stdin/stdout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wta-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[lints]
workspace = true
