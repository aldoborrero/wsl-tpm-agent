<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 240" width="1020" height="240" role="img" aria-labelledby="title desc">
  <title id="title">How a signature is made</title>
  <desc id="desc">A client in WSL connects to tpm-agent.sock. systemd starts one wsl-tpm-agent.exe per connection through WSL interop. The executable signs through NCrypt with a P-256 key in the TPM and the signature travels back to the client. The private key never leaves the TPM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .region { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; letter-spacing: 0.08em; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .tpm { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .name { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1f2328; }
    .sub { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .label { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .edge { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>

  <text class="region" x="24" y="34">WSL</text>
  <text class="region" x="528" y="34">WINDOWS</text>
  <line class="edge" x1="510" y1="18" x2="510" y2="46"/>
  <line class="edge" x1="510" y1="70" x2="510" y2="232"/>

  <rect class="box" x="24" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="94" y="104" text-anchor="middle">git · ssh</text>
  <text class="sub" x="94" y="124" text-anchor="middle">ssh-keygen -Y sign</text>

  <rect class="box" x="188" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="258" y="104" text-anchor="middle">tpm-agent.sock</text>
  <text class="sub" x="258" y="124" text-anchor="middle">mode 0600</text>

  <rect class="box" x="352" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="422" y="104" text-anchor="middle">systemd</text>
  <text class="sub" x="422" y="124" text-anchor="middle">Accept=yes</text>

  <rect class="box" x="528" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="598" y="98" text-anchor="middle">wsl-tpm-agent</text>
  <text class="name" x="598" y="116" text-anchor="middle">.exe</text>
  <text class="sub" x="598" y="136" text-anchor="middle">one per connection</text>

  <rect class="box" x="692" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="762" y="98" text-anchor="middle">NCrypt</text>
  <text class="sub" x="762" y="118" text-anchor="middle">Platform Crypto</text>
  <text class="sub" x="762" y="134" text-anchor="middle">Provider</text>

  <rect class="tpm" x="856" y="70" width="140" height="84" rx="8"/>
  <text class="name" x="926" y="98" text-anchor="middle">TPM 2.0</text>
  <text class="sub" x="926" y="118" text-anchor="middle">P-256 key</text>
  <text class="sub" x="926" y="134" text-anchor="middle">not exportable</text>

  <line class="line" x1="164" y1="112" x2="186" y2="112" marker-end="url(#arrow)"/>
  <line class="line" x1="328" y1="112" x2="350" y2="112" marker-end="url(#arrow)"/>
  <line class="line" x1="492" y1="112" x2="526" y2="112" marker-end="url(#arrow)"/>
  <text class="label" x="510" y="62" text-anchor="middle">interop</text>
  <line class="line" x1="668" y1="112" x2="690" y2="112" marker-end="url(#arrow)"/>
  <line class="line" x1="832" y1="112" x2="854" y2="112" marker-end="url(#arrow)"/>

  <path class="line" d="M926 154 V196 H94 V156" marker-end="url(#arrow)"/>
  <text class="label" x="300" y="216" text-anchor="middle">signature (stdin/stdout, through the socket)</text>
  <text class="label" x="996" y="216" text-anchor="end">the private key never leaves the TPM</text>
</svg>
