[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aldoborrero/wsl-tpm-agent"

# Shared by every crate (`[lints] workspace = true`); `unsafe_code` stays per crate/module as an
# attribute because only the NCrypt adapter may use it.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1

[workspace.metadata.crane]
name = "wsl-tpm-agent"
